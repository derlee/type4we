[workspace]
resolver = "2"
members = ["crates/type4we-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Type4We contributors"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
async-trait = "0.1"
futures-util = "0.3"
tracing = "0.1"
